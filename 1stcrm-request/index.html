<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1stCRM 요청 접수</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F7FB;
    --surface:#FFFFFF;
    --surface-2:#EDF1F7;
    --border:#DEE3ED;
    --ink:#101A2E;
    --ink-strong:#03153B;
    --muted:#5B6478;
    --accent:#1070FC;
    --accent-text:#0C56C2;
    --gold:#E0A32E;
    --navy:#03153B;
    --shadow: 0 1px 2px rgba(3,21,59,0.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1220;
      --surface:#101B2E;
      --surface-2:#16233C;
      --border:#22314C;
      --ink:#E7EAF2;
      --ink-strong:#FFFFFF;
      --muted:#95A2BC;
      --accent:#4C93FF;
      --accent-text:#7FB0FF;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1220;
    --surface:#101B2E;
    --surface-2:#16233C;
    --border:#22314C;
    --ink:#E7EAF2;
    --ink-strong:#FFFFFF;
    --muted:#95A2BC;
    --accent:#4C93FF;
    --accent-text:#7FB0FF;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }

  a{ color:var(--accent-text); text-decoration:none; }
  a:hover{ text-decoration:underline; }

  .masthead{
    background:#03153B;
    padding:22px max(20px, calc(50% - 360px));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead .logo{ height:22px; width:auto; display:block; flex:none; }
  .masthead .brand-meta{ text-align:right; }
  .masthead .eyebrow{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.14em;
    color:#E0A32E;
    text-transform:uppercase;
    margin:0 0 3px;
  }
  .masthead .client{
    font-size:15px;
    font-weight:600;
    color:#FFFFFF;
    margin:0;
    letter-spacing:0.01em;
  }

  .layout{
    max-width:720px;
    margin:0 auto;
    padding:0 20px;
  }

  main{
    max-width:720px;
    padding:44px 0 24px;
  }
  header.report-head h1{
    font-size:clamp(24px, 4vw, 30px);
    font-weight:700;
    color:var(--ink-strong);
    margin:0 0 8px;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  header.report-head .desc{
    margin:0 0 32px;
    color:var(--muted);
    font-size:14.5px;
    max-width:520px;
  }

  h2.section-head{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-strong);
    margin:0 0 14px;
  }
  h2.section-head::before{
    content:"";
    width:9px; height:9px;
    background:var(--accent);
    flex:none;
  }

  .form-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .form-card iframe{
    display:block;
    width:100%;
    height:800px;
    border:0;
    background:var(--surface);
  }
  .form-fallback{
    padding:20px 22px;
    font-size:13.5px;
    color:var(--muted);
    border-top:1px solid var(--border);
  }

  .note-card{
    margin-top:24px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 20px;
    font-size:13.5px;
    color:var(--muted);
  }
  .note-card strong{ color:var(--ink); font-weight:600; }

  footer{
    max-width:720px;
    padding:28px 0 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    border-top:1px solid var(--border);
    margin-top:16px;
  }
  footer .symbol{ height:16px; width:auto; flex:none; opacity:0.85; }
  footer .note{ color:var(--muted); font-size:12.5px; }
  footer .note strong{ color:var(--ink); font-weight:600; }

  @media (max-width: 480px){
    .masthead{ padding:18px 16px; }
    .layout{ padding:0 16px; }
    .form-card iframe{ height:980px; }
  }
</style>
</head>

<div class="layout">
  <main>
    <header class="report-head">
      <h1>1stCRM 요청 접수</h1>
      <p class="desc">진행 중 필요한 작업이나 문의 사항을 아래에 남겨주시면 확인 후 순서대로 처리해드리겠습니다.</p>

    <section>
