# jiranjigyo · 2026-09-21
# 원문: clients/jiranjigyo/intake/2026-09-21.md (웹 입력, 추현호/고주형)
period: 2026.09.21 – 09.27
asOf: 2026.09.21

summary: >-
  운영자콘솔 개편은 설계를 확정하고 개발에 들어갔으며, 점검 분류 체계와 안전 통제까지
  규격을 확정했습니다. 실제 모의해킹을 수행하지 않는데도 결과가 모두 모의해킹으로 표시되던
  구조를 바로잡아 고객에게 점검 범위가 정확히 전달되고, 고객 환경에 부하를 줄 수 있는
  점검 방식은 이중 검증으로 원천 차단했습니다. 이번 주는 개편 화면 QA와 분류 변경에 따른
  데이터·화면 정비를 진행합니다. 다만 고객–워크스페이스 관계를 지난 회차의 1:N 안에서
  1:1로 확정했고 분류 명칭 변경이 고객 화면에 그대로 노출되므로, 두 건에 대한 확인을
  요청드립니다.

sections:
  - type: dual
    title: Safe Intelligence
    columns:
      - label: 지난주 한 일
        items:
          - text: 운영자콘솔 개편 — 설계 확정, 개발 진행 중
            sub:
              - 고객–워크스페이스 관계를 **1:1** 로 확정하고 기존 데이터 이관 방안 수립 (지난 회차 1:N 안에서 변경)
              - 고객 정보(국가·회사명·담당자)는 운영자만 지정하고, 이메일·비밀번호는 수정 불가로 규정
              - 고객 목록 필터·관리 바로가기·정보 수정 규칙 규격화, 권한 15종 정의 (고객 정보 수정은 빌링 역할)
              - 국가·회사명·담당자·플랜·다크웹 등급 등 검색 조건 확정
              - 고객리스트를 진입점으로 하는 메뉴 구조 화면 흐름 정리
          - text: 점검 분류 체계 재정립 — 규격 확정
            sub:
              - 모의해킹(Pentest) 표기를 실제 수행 내용에 맞춰 HTTP/TLS 응답 점검으로 변경 — 점검 범위가 과장되어 전달되던 문제를 해소했습니다
              - 결과 유형에서 모의해킹 항목을 없애고 기본 자격증명·기술 탐지를 분리해 16종으로 정리
              - 기술 탐지는 '탐지 항목'으로 표기하고 보안 점수 감점에서 제외 — 전체 건수가 취약점 수로 오독되던 문제를 해소했습니다
              - 히트맵 민감 경로 구성 확정 (민감 경로·누락 헤더·기본 자격증명)
          - text: 위험 점검 방식 차단 — 고객 환경에 부하를 줄 수 있는 점검을 원천 제거
            sub:
              - Deep 프로필에서 fuzzing·워크플로 계열 점검 제거
              - 이미지 패키징 시점과 실행 직전 두 번 검증하고, 우회 가능한 경로 지정은 거절하며, 검증 실패 시 실행하지 않음
              - 실행마다 전용 임시 환경을 만들고 환경 변수를 비워 실행 간 간섭 차단
          - text: 점검 정확도 개선
            sub:
              - TLS 적용 여부를 최종 응답 기준으로 기록
              - 도구 비정상 종료를 '이상 없음'과 구분해 오류로 기록 — 점검 실패가 정상 결과로 보이던 문제를 해소했습니다
              - 결과 수집까지 제한 시간에 포함
          - text: 스캔 요청 규격 정비 — 잘못된 요청에 크레딧이 차감되지 않도록 예약 전에 차단
            sub:
              - 스캔 종류가 없거나 구형 값이면 크레딧 예약 전에 거절
              - 구형 결과 유형 요청과 삭제된 결과 조회에 대한 응답 규칙 확정
          - text: 빌링 및 사용내역 화면 설계 완료 — 월 청구 근거를 화면에서 바로 확인할 수 있습니다
            sub:
              - 고객사별 월별 이용 이력(기본·추가·사용 크래딧) 조회 화면
              - 선택 월의 크래딧 사용 세부내역(날짜·도메인·점검 구분) 화면
              - 연월 지정 조회 및 CSV 내보내기 요건 확정
          - 감사 로그 표기 기준 확정 — 한국어·일본어 표기와 동작 식별 기준 정의
          - 단계별 개발 순서 확정 — 데이터 구조 개편을 선행하고 메일 알림 개선은 후속 과제로 분리
          - 일본 운영측 자료 내부 검토 및 회신 완료
      - label: 이번주 할 일
        items:
          - text: 운영자콘솔 개편 마무리
            sub:
              - 실제 화면 기반 담당자 QA 진행 후 일본 측 전달
          - text: 분류 변경에 따른 데이터·화면 정비
            sub:
              - 기존 저장 데이터에 신규 분류 기준 반영
              - 사용자 화면의 분류 표시·필터 기준 수정
          - text: 번역 템플릿 대응
            sub:
              - 한·영·일 템플릿 수정 및 재검수
              - 각 언어 화면에서 변경 항목이 정상 표시되는지 확인
          - text: 메일 알림 기능 설계
            sub:
              - 알림 시스템 신규 도입 여부 확정 후 설계 착수

  - type: notes
    title: 리스크 및 의존성
    items:
      - tag: 설계 변경
        text: >-
          고객–워크스페이스 관계를 1:1로 확정했습니다. 지난 회차에 1:N으로 보고드린
          내용에서 바뀐 것이며, 기존 데이터 이관 방안도 1:1 기준으로 수립했습니다.
      - tag: 고객 영향
        text: >-
          점검 결과의 분류 명칭과 화면 표기가 바뀌고 기존 데이터도 새 기준으로 재분류됩니다.
          고객이 보던 표기가 달라지므로 사전 공지 여부를 정해야 합니다.
      - tag: 논의 필요
        text: >-
          메일 알림 기능은 알림 시스템 자체가 제품에 없어 신규 도입 여부를 먼저 정해야 합니다.
          결정 시점에 따라 설계 착수 시점이 달라집니다.

  - type: card
    title: 요청사항
    items:
      - text: 고객–워크스페이스 1:1 확정안에 대한 확인을 요청드립니다.
      - text: 분류 명칭 변경에 대한 고객 사전 공지 여부를 결정해주시기 바랍니다.
      - text: 알림 시스템 신규 도입 여부를 확정해주시면 메일 알림 기능 설계에 착수하겠습니다.
