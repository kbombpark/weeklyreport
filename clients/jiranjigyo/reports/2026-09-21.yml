# jiranjigyo · 2026-09-21
# 원문: clients/jiranjigyo/intake/2026-09-21.md (웹 입력, 추현호)
period: 2026.09.21 – 09.27
asOf: 2026.09.21

summary: >-
  운영자콘솔 개편은 설계를 확정해가며 개발에 착수했습니다. 사용자를 계약 회사 단위로 묶는
  고객사 데이터 구조를 정의하고, 이를 기반으로 고객 검색·빌링·월별 사용내역 화면 설계를
  마쳤습니다. 이번 주에는 실제 화면으로 담당자 QA를 진행해 일본 측에 전달하고, 점검 결과
  분류 체계를 재정립합니다. 알림 시스템이 현재 제품에 없어 신규 도입 여부를 먼저 결정해야
  하며, 그에 따라 메일 알림 기능의 일정이 정해집니다.

sections:
  - type: dual
    title: Safe Intelligence
    columns:
      - label: 지난주 한 일
        items:
          - text: 운영자콘솔 개편 — 설계와 개발을 병행해 진행 중
            sub:
              - 사용자를 계약 회사 단위로 묶는 고객사 데이터 구조 정의 — 고객사 기준 조회가 가능해집니다
              - 고객사–워크스페이스 관계 정의 및 기존 데이터 이관 방안 수립
              - 국가·회사명·담당자·메일주소·워크스페이스명·상태·플랜·다크웹 등급 검색 조건 확정
              - 고객리스트를 진입점으로 하는 메뉴 구조 화면 흐름 정리
          - text: 빌링 및 사용내역 화면 설계 완료 — 월 청구 근거를 화면에서 바로 확인할 수 있습니다
            sub:
              - 고객사별 월별 이용 이력(기본·추가·사용 크래딧) 조회 화면
              - 선택 월의 크래딧 사용 세부내역(날짜·도메인·점검 구분) 화면
              - 연월 지정 조회 및 CSV 내보내기 요건 확정
          - text: 감사 로그 표기 기준 확정
            sub:
              - 액션·리소스의 한국어·일본어 표기 방식 정의
              - 어떤 동작인지 식별 가능하도록 로그 표현 기준 정리
          - text: 단계별 개발 순서 확정
            sub:
              - 데이터 구조 개편을 선행 과제로 두고 설계 확정 후 개발 순서 정의
              - 메일 알림 기능 개선은 후속 과제로 분리
      - label: 이번주 할 일
        items:
          - text: 운영자콘솔 개편 마무리
            sub:
              - 실제 화면 기반 담당자 QA 진행 후 일본 측 전달
          - text: 메일 알림 기능 설계
            sub:
              - 알림 시스템 신규 도입 가능 여부 확정 후 설계 착수
          - text: 점검 결과 분류 체계 재정립
            sub:
              - 모의해킹(Pentest)으로 일괄 표시되던 점검 결과를 실제 점검 성격에 맞게 세분화
              - 세분화 기준에 따른 카테고리 정의 및 명칭 정리
              - 기존 저장 데이터 반영, 사용자 화면의 분류 표시·필터 기준 수정
              - 한·영·일 번역 템플릿 수정 및 재검수
          - text: 위험 점검 방식 차단
            sub:
              - 문제 소지가 확인된 fuzzing 계열 점검 방식 제거
              - AI가 해당 방식으로 점검을 수행할 수 없도록 원천 차단

  - type: notes
    title: 리스크 및 의존성
    items:
      - tag: 논의 필요
        text: >-
          메일 알림 기능은 알림 시스템 자체가 제품에 없어 신규 도입 여부를 먼저 정해야 합니다.
          결정 시점에 따라 설계 착수 시점이 달라집니다.
      - tag: 확인 필요
        text: >-
          현재 실제 모의해킹은 수행하지 않는데도 관련 도구를 사용한 점검 결과가 모두
          'Pentest'로 표시되고 있어, 대외 소통에서 범위가 과장되어 전달될 소지가 있습니다.
          이번 주 분류 체계를 재정립합니다.

  - type: card
    title: 요청사항
    items:
      - text: 알림 시스템 신규 도입 여부를 확정해주시면 메일 알림 기능 설계에 착수하겠습니다.
      - text: >-
          점검 결과 분류 명칭은 고객 화면에 그대로 노출됩니다. 정리안이 나오는 대로
          공유드릴 예정이니 확정 전 검토를 요청드립니다.
