# 1stcrm · 2026-09-22 — 단발성 공유 문서 (주간 보고 아님)
# 원문: 라크 위키 NByJwjwLyiAqWfkr1yKjBBIdpSc
title: 문자 발송 고객 추가 인증 시스템 구축
eyebrow: Project Note
footerNote: 본 문서는 공유 시점 기준입니다
period: 공유일 2026.09.22

summary: >-
  문자를 발송하는 계정에 추가 문자 인증 절차를 도입합니다. 법적 요건에 따라
  2026년 10월 26일까지 적용해야 하며, 적용 후에는 문자 발송 권한이 부여된 계정만
  사전 등록된 번호로 인증을 거쳐 문자를 보낼 수 있습니다. 인증은 한 번 완료하면
  8시간 유지되므로 발송할 때마다 다시 받지는 않습니다.

sections:
  - type: notes
    title: 배경
    items:
      - tag: 법적 요건
        text: >-
          2026년 10월 26일까지 문자를 발송하는 사용자는 추가 문자 인증을 거치도록
          변경해야 합니다.

  - type: card
    title: 구축 방안
    items:
      - text: 계정을 문자 발송 가능 계정과 불가 계정으로 구분합니다.
      - text: 계정 설정 화면에서 라디오 버튼으로 문자 발송 권한을 지정합니다.
        sub:
          - 권한을 활성화하면 인증 문자를 받을 전화번호를 함께 등록합니다.
      - text: 문자 발송 권한이 있는 계정은 로그인 시 문자 인증을 완료해야 로그인됩니다.
      - text: 문자 발송 시에도 사전 등록된 번호로 인증을 완료해야 발송됩니다.
      - text: 인증은 한 번 완료하면 8시간 동안 유지되며, 그 사이에는 다시 받지 않습니다.
      - text: 예약 문자는 예약을 등록하는 시점에만 인증하면 됩니다.

  - type: card
    title: 문자 인증이 필요한 시점
    items:
      - 예약 문자를 등록할 때
      - 고객을 직접 선택해 발송할 때
      - 광고성 메시지를 발송할 때

  - type: text
    title: 적용 화면
    text:
      - >-
        계정 설정 화면(**계정 관리 > 계정 설정**)에 문자 발송 권한 선택과 인증 번호
        등록 항목을 추가합니다.
      - https://www.1stcrm.co.kr/master/account
