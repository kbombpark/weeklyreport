summary: >-
  신규 병원 생성 기능과 악성 문자 시스템 인프라 구축을 마치고 DB 이전 계획까지 수립했습니다.
  다만 DUR은 뮤디오션 코드로는 승인이 불가능하다는 통보를 받아, 지난 회차에 이전 완료로
  보고드린 부분을 심평원 기준 문서에 맞춰 다시 개발해야 합니다. 이번 주는 DUR 재개발과
  DB 마이그레이션 검증을 진행합니다.

